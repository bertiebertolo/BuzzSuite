# buzzsuite_env: pinned to the versions installed on the machine where tracking was validated
# (2026-10-16). On Windows, create it with setup_env.bat (it also applies the pip-wheel step below
# and runs check_install.py). By hand: conda env create -f environment.yml, then the pip line below.
#
# numpy/matplotlib/kiwisolver/contourpy must be the PyPI wheels, not the conda-forge builds: the
# conda-forge builds crash (0xC06D007F) on 2-D matrix multiply under Windows Memory Integrity + CET,
# which kills every plot (DEVLOG 2026-09-16). conda installs them as dependencies first, so replace
# them afterwards:
#   python -m pip install --force-reinstall --no-deps numpy==1.24.4 matplotlib==3.7.3 kiwisolver==1.4.5 contourpy==1.1.1
name: buzzsuite_env
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - matplotlib=3.7.3
  - kiwisolver=1.4.5
  - contourpy=1.1.1
  - scikit-learn=1.3.2
  - statsmodels=0.14.1
  - seaborn=0.13.2
  - umap-learn=0.5.6
  - numba=0.58.1
  - pillow=10.0.0
  - psutil=6.0.0
  - tqdm=4.67.1
  - openpyxl=3.1.5
  - tk=8.6.13
  - ffmpeg=6.1.0
  - pip
  - pip:
      - opencv-python==4.8.0.76  # exact wheel the tracker was validated on; do not change
      - pyyaml==6.0.3
      - tkcalendar==1.6.1
      - pyarrow>=14,<17  # optional: Parquet output of tracking_export.py (CSV fallback without it)
